name: check for flake updates
on: { workflow_dispatch, schedule: [cron: '0 0 * * *'] }
jobs:
  check-for-updates:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.NIX_UPDATES_PAT }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-trusted-public-keys = adaptivereader.cachix.org-1:AoiyYyEjcXjS0Ci77VIubWfUKOusjweA7S43UYkC/sw=
            extra-substituters = https://adaptivereader.cachix.org
      - run: nix flake update
      - uses: peter-evans/create-pull-request@v8.1.1
        id: pr
        with:
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          base: main
          branch: updates-nix
          commit-message: 'Update nix pin'
          title: '[BOT-000]: nix updates'
          token: ${{ secrets.NIX_UPDATES_PAT }}
      - if: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash ${{ steps.pr.outputs.pull-request-url }}
